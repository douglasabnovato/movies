<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/movie.png" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2d0c5e" />
    <!-- Valem para todas as páginas: o HashRouter não entrega ao robô a rota depois do # -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Movies" />
    <meta property="og:title" content="Movies: explore e busque filmes" />
    <meta property="og:description" content="Busque por nome, filtre por gênero e veja ficha, elenco e trailer dos filmes." />
    <meta property="og:url" content="https://douglasabnovato.github.io/movies/" />
    <meta property="og:image" content="https://douglasabnovato.github.io/movies/movie.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logo do Movies" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="description"
      content="Aplicação para exploração e busca de filmes integrada com a API da TMDB."
    />    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <title>Movie's</title>
    <style>
      /* O esqueleto vale só para a Home sem filtros */
      .no-shell #app-shell { display: none; }
    </style>
    <script>
      /* Só na Home sem filtros: adianta a lista e o primeiro pôster, sem esperar o JavaScript da aplicação. */
      (function () {
        var key = "%REACT_APP_TMDB_KEY%";
        var hash = location.hash;
        if (hash !== "" && hash !== "#/") {
          document.documentElement.className = "no-shell";
          return;
        }
        if (key.charAt(0) === "%") return;
        window.__moviesHomePreload = fetch(
          "https://api.themoviedb.org/3/movie/popular?api_key=" + key + "&language=pt-BR&page=1"
        )
          .then(function (response) {
            return response.ok ? response.json() : null;
          })
          .then(function (data) {
            var first = data && data.results && data.results[0];
            if (first && first.poster_path) {
              var link = document.createElement("link");
              link.rel = "preload";
              link.as = "image";
              link.href = "https://image.tmdb.org/t/p/w342" + first.poster_path;
              link.setAttribute("fetchpriority", "high");
              document.head.appendChild(link);
              /* Põe o pôster no esqueleto, sem esperar o React montar a lista. */
              var showPoster = function () {
                var slot = document.querySelector("#shell-first .skeleton-poster");
                if (slot) slot.style.background = "#3c137c url(" + link.href + ") center / cover no-repeat";
              };
              if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", showPoster);
              else showPoster();
            }
            return data;
          })
          .catch(function () {
            return null;
          });
      })();
    </script>
  </head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para executar esta aplicação.</noscript>
    <div id="root">
      <!-- Esqueleto da Home, trocado pelo React: conteúdo antes do JavaScript, com as mesmas classes da página -->
      <div class="app-container" id="app-shell">
        <main class="main">
          <header class="top">
            <nav class="navbar"><div class="title-site"><p class="title-text">Movies<span class="title-obj"></span></p></div></nav>
            <section class="slogan"><p class="slogan-text">Milhões de filmes, séries e pessoas para descobrir. Explore já.</p></section>
            <section class="search-bar-container"><input class="search-input" type="search" disabled aria-label="Buscar filme pelo nome" placeholder="Pesquise por um filme pelo nome..." /></section>
            <section class="filter"><div class="filter-container"><p class="filter-text">FILTRE POR:</p><div class="filter-box"></div></div></section>
          </header>
          <section class="films"><div class="film-skeleton" id="shell-first"><div class="skeleton-poster pulse"></div><div class="skeleton-title pulse"></div><div class="skeleton-date pulse"></div></div><div class="film-skeleton"><div class="skeleton-poster pulse"></div><div class="skeleton-title pulse"></div><div class="skeleton-date pulse"></div></div><div class="film-skeleton"><div class="skeleton-poster pulse"></div><div class="skeleton-title pulse"></div><div class="skeleton-date pulse"></div></div><div class="film-skeleton"><div class="skeleton-poster pulse"></div><div class="skeleton-title pulse"></div><div class="skeleton-date pulse"></div></div></section>
        </main>
      </div>
    </div> 
  </body>
</html>
