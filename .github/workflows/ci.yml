name: CI/CD Pipeline - Movies App

on:
  push:
    branches:
      - main
      - 'developer/**'
  pull_request:
    branches:
      - main
      - 'developer/**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Lint
        run: npm run lint

      - name: Executar Testes com Cobertura
        run: npm run test:ci
        env:
          CI: true

      - name: Executar Build de Produção
        run: npm run build
        env:
          CI: true

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Gerar Build para o Teste
        run: npm run build
        env:
          CI: true
          PUBLIC_URL: /
          REACT_APP_TMDB_KEY: e2e-sem-api-real

      - name: Instalar o Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Executar o Fluxo Principal
        working-directory: e2e
        run: npm test
        env:
          CI: true

  deploy:
    needs: [build-and-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Gerar Build com a Chave
        run: npm run build
        env:
          CI: true
          REACT_APP_TMDB_KEY: ${{ secrets.REACT_APP_TMDB_KEY }}

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
